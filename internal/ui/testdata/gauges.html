<!doctype html><html><head><title>Gauges</title></head><body>
<h1>Status</h1>
<p>Upload <progress id="p" value="0.5" max="1">50%</progress> done.</p>
<p>Waiting <progress></progress></p>
<p>Disk <meter id="m" min="0" max="100" low="30" high="80" value="65">65 of 100</meter> used.</p>
<div role="progressbar" aria-label="Build" aria-valuemin="0" aria-valuemax="100" aria-valuenow="42" aria-valuetext="42 percent"></div>
<details><summary>Show more</summary><p>The hidden part.</p></details>
<details open><summary>Already open</summary><p>The visible part.</p></details>
<form>
<label for="d">Day</label> <input id="d" type="date" value="2026-09-23">
<label for="dt">When</label> <input id="dt" type="datetime-local">
<label for="t">Time</label> <input id="t" type="time" value="13:45">
<label for="mo">Month</label> <input id="mo" type="month">
<label for="w">Week</label> <input id="w" type="week">
<label for="c">Tint</label> <input id="c" type="color" value="#336699">
</form>
</body></html>
