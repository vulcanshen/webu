tasks:
  - id: 1
    spec: 1
    implementation: |
      畫面 chip 列五個畫面（tgo 的 screen）：W Web、B Bookmarks、H History、D Downloads、S Settings；大寫字母或 Space › Global operation 切換，lib 記 App Log「Switched to …」
      Web 畫面：[1] TABS（tgo List）與 [2] PAGE（app 自己的 Body）並排；窄寬門檻 60 欄，webu 畫得出來的寬度都是兩個 panel 並排
      [2] 顯示 [1] 游標所在的分頁；[1] 的 Enter 把 focus 送到 [2]
      Z（[2] 的 panel 動作）：[2] 佔滿寬度，再按還原；App Log「Zoomed in on the page」「Zoomed out to the tabs and the page」
    test: [TestScreensAndSession]
  - id: 2
    spec: 3
    implementation: |
      `webu`：restore_session 開著時開回 session.yaml 記的分頁，只有原本顯示的那一個載入
      `webu <網址>…`：一個網址一個分頁，第一個在前面；不像網址的字照 search_engine 搜尋
      `webu version`（也收 -v、--version）只印 internal/version 的 Display()，跟 tag 一樣（例：v0.7.0；本機建的是 dev）；`webu help`（也收 -h、--help）印命令列說明：
        webu                     the last session's tabs
        webu <url|words> ...     open each in a new tab, the first in front; words that are not a URL are searched
        webu version             webu's version
        webu update              bring webu to its latest release
        webu help                this
      `webu update`：tgo 的 terminu.SelfUpdate（App webu、Owner vulcanshen、Tap vulcanshen/tap、Source `git pull && make install`），照當初的裝法更新到最新的正式版：Homebrew 跑 brew upgrade vulcanshen/tap/webu；安裝腳本或下載的，下載這個系統的那一份、對過 checksums.txt 換掉執行檔；已經是最新版或比最新版新（beta）說一句，exit 0；本機建的（dev）說到原始碼那邊更新，句子裡的指令用反引號（「webu: This webu is built from source: update it there (`git pull && make install`)」），exit 1；沒有權限寫執行檔所在的地方說怎麼做，exit 1，不要 sudo
      version、update、help 都在讀設定之前回答，沒有設定也能用、不開畫面
      其他以 - 開頭的參數是用錯：stderr 印「webu: Unknown option "<參數>"」、空一行、再印說明，exit 2
      結果寫 stdout，錯誤寫 stderr、一件一行、開頭 webu: ；exit status 只有 0、1、2：畫面結束後 session.yaml 寫不進去、或畫面回了錯誤（讀不了的檔按 Esc 離開）是 1；外面送來的 SIGINT 跟關掉終端機（lib 處理 SIGHUP）一樣算離開，0
    test: [TestCommandLine, TestResolveURL, TestRoundTrips, commit: beb5b5d]
  - id: 3
    spec: 3
    implementation: |
      [1] TABS 是 tgo List，一列一個分頁：網站記號加頁面標題；記號是網站在 Nerd Font 裡的 icon（GitHub、Wikipedia、Go…），沒有就是地球，顏色是 favicon 的主色，知道之前是 Blue
      panel 動作：Enter 到頁面、c 關閉（App Log「Closed the tab …」）、o 在新分頁再開（「Opened … in a new tab」）、r 重新載入（「Reloaded …」）、y 複製網址、T 新分頁、C 關閉其他、U 重開剛關的
      關掉的分頁 U 開得回來，不是永久拿掉：關一個在 c、關其他在 C，不用 x、X（tdp K13，K13-5）
      favicon 抓來後讀 ICO（1／4／8／24／32 bit）或 PNG 算主色
    test: [TestSiteMarks, TestIconColor, TestCloseOthersIsOnC, commit: b1f2eda]
  - id: 4
    spec: 1
    implementation: |
      net/http 抓網頁（跟著轉址、cookie jar、x/net/html/charset 轉 UTF-8），x/net/html 解析，不跑 JavaScript
      挑內容：Readability 挑得到就用（保留 class，code block 的語言才在）；挑不到就是整頁減掉導覽、頁首、頁尾、側欄；cookie 告示、看不到的元素不顯示
      不是 HTML 的（JSON、YAML、純文字…）整份當一個 code block
      w（[2] 的 panel 動作）：整頁與正文切換，App Log「Showed the full page of …」「Showed the content of …」
    test: [TestAnArticleLeavesTheSiteOut, TestAnArticleKeepsItsCodeLanguage, TestAListPageAndItsTables, TestWhatIsHiddenIsLeftOut, TestTextBig5AndDownloads, TestReaderReadsAndFollows]
  - id: 5
    spec: 2
    implementation: |
      內容樹畫成 webu 自己的元件（[2] 的 Body）：
      標題：字是 Base，放在那一層的顏色上、左右各一格（Peach、Rosewater、Green、Teal、Flamingo 輪流）
      清單：無序是 Blue 的短橫線，有序依深度 1.／a.／i.
      程式碼區塊：Mantle 底，用 tgo 的 Syntax 上色（tdp file-picker.3），右上角寫語言名（Overlay0）；網頁沒標語言時讓 chroma 猜
      引用：開頭 ▎，顏色是那一層的標題色，Mantle 底；引用裡的引用前面只空一列
      表格：排版用的照區塊讀，資料表畫成格子（Overlay0）、表頭粗體
      連結：link icon 加字，Sapphire、底線；圖片：image icon 加替代文字，Overlay0
      字左右各留一格，沒有行號
      網頁照瀏覽器畫：一般文字裡的 Tab、\n 跟空白一樣收成一格（\r 由 HTML parser 先變成 \n）；<pre> 與程式碼區塊裡 Tab 畫成 input_tab_width 格空白、\n 換行；其他控制字元，包括顏色碼的 ESC 與 \f，畫成它的名字、Red（\x1b、\x0c），不送到終端機，網頁不給任何字上色
    test: [TestQuotesInQuotes, TestCodeInTheFamilysSyntaxColours, TestTrickyTextFromOutside, TestItemsAndAnchors, TestAPageIsDrawnAsABrowserDrawsIt]
  - id: 6
    spec: 1
    implementation: |
      [2] 沒有 cursor（二維內容，捲動）：j|k 一列、u|d 半頁（PgUp|PgDn 一樣，不列出）、gg|G 頭尾
      下框寫捲動位置「1-24 of 310」（Body 的 Scroll）
    test: [commit: 0311a52]
  - id: 7
    spec: 1
    implementation: |
      [2] 的位置列是 tgo 的 Panel.Location：網址，前面是 Panel.LocationGlyph（nf-md-web），Lavender，太長只從前面截網址，glyph 留著
      載入中：框上有 loading icon；頁面還沒有內容時，中間是 LoadingText「loading <host>…」
      抓不到（DNS、連線、憑證）：Panel.Fail，中間兩句，事實 Red、提示「Press [R] to retry」；App Log 記一筆
      位置列在 loading 與錯誤上面照樣留著；[2] 失焦時跟著淡化
      R（[2] 的 panel 動作，Space menu 的 [R]eload）重新載入這一頁，App Log「Reloaded …」；沒有分頁或正在載入時停用
    test: [TestAPageThatCannotBeReached, TestTheAddressStaysWhileLoading]
  - id: 8
    spec: 1
    implementation: |
      / （[2] 的 panel 動作，也在 Space menu）：開 tgo 的 TextInput「Find」問要找的字；Space menu 留在輸入框底下，Esc 回到 menu，Enter 執行後兩個一起關（App.CloseAll）
      找到的都加底線，目前那一筆是 cursor 色塊；n|N 下一個、上一個，頭尾繞回，捲到看得見
      有命中時 Panel.SearchStatus 讓 lib 在下框捲動位置左邊寫「/<字> 2 of 5」
      找不到：Info toast「Not on the page: <字>」
      Esc 收掉找到的（K4，往上一層）
      找字不記進 App Log（找不到時 toast 自己會記）
    test: [TestReaderSearchesAsTdp120Says, TestReaderReadsAndFollows]
  - id: 9
    spec: 3
    implementation: |
      f 進 Focus mode（tgo 的 Mode，框與模式名 Yellow）；Esc 離開
      j|k 照閱讀順序走連結、圖片、欄位、按鈕，頭尾繞回；gg|G 第一個、最後一個；cursor 是 panel cursor 色塊
      停在連結上時，連結有 note（tgo 的 Mode.Note，tdp panel.18）寫它會去的網址：cursor 停在連結上時 lib 在連結正下方畫 note 的小標（nf-md-information_outline 與 i），蓋在下一列上、不收鍵；i 打開 NOTE viewer，接在連結下面、focus 在裡面，可以捲、/ 找字、v 選取複製；Esc 關回小標，還在 Focus mode。連結在最後一列、下面沒空間時小標與 note 開在上面。欄位、按鈕、單獨的圖片沒有 note
      page 的 Body 實作 tgo 的 NoteSpot（NoteAt）：游標所在那一項畫在第幾列到第幾列、字從第幾格開始；不在畫面上時沒有
      i 是 note 的鍵（tdp K13），webu 沒有別的動作用 i；lib 把 i 放進 Focus mode 的鍵，? 列得出來
      mode 的 Space menu：Enter Press、o Open in a new tab、y Copy its address
      Enter 在連結上直接開（App Log「Followed the link to …」），離開 Focus mode
    test: [TestFocusModeWraps, TestALinkNoteOnTheLastRow, TestReaderReadsAndFollows]
  - id: 10
    spec: 1
    implementation: |
      H|L（[2] 的 panel 動作，寫在 hint 上）：沿著分頁自己的歷史上一頁、下一頁，回到離開時的位置；沒有上一頁或下一頁時停用；App Log「Went back in …」「Went forward in …」
      b 麵包屑：開 tgo 的 Menu「Breadcrumb」，一列一頁「1. 標題」，目前那一頁寫「where the tab is now」，其他「go to it」，選了直接跳，不先問；歷史少於兩頁（還沒有別頁可跳）時停用，跟 H|L 一樣
    test: [TestReaderReadsAndFollows, commit: b8b5e1c]
  - id: 11
    spec: 1
    implementation: |
      o（[2] 的 panel 動作）：開 tgo 的 TextInput「Location」，目前的網址當灰字提議（Tab 接過來改、Backspace 不要它、直接打字從頭打）
      Enter：像網址的就開，不像的照 config.yaml 的 search_engine 搜尋（預設 https://html.duckduckgo.com/html/?q=）；App Log「Went to …」
    test: [TestLocationOffersThePageURL, TestResolveURL]
  - id: 12
    spec: 1
    implementation: |
      表單畫在頁面上（Form 的框、欄位的 label 與值）；在 Focus mode 裡 Enter：
      文字欄位開 tgo 的 TextInput（密碼欄位用 password，值不顯示），App Log 只記「Typed into <欄位>」，不記值
      checkbox 原地勾選（「Ticked …」「Unticked …」），radio 與 select 開選項（「Chose …」）
      按鈕：送出表單，hidden 欄位一起送；GET 放在網址、POST 放在 body；App Log「Sent … to …」
      只有一個可以打字的欄位時，填完開 confirm 問要不要送出
      需要 JavaScript 的登入、別的網站帳號、CAPTCHA、兩步驟都不支援
    test: [TestFormsAreSent, TestReaderSignsInAndSearches]
  - id: 13
    spec: 3
    implementation: |
      每收到一個 cookie 就寫進狀態目錄的 cookies.json（0600、原子寫入），session cookie 也存；下次啟動讀回來
      S › X Clear sign-in data（一次刪很多在 X，tdp K13）：開 confirm，Enter 清掉所有網站的 cookie
      cookie 的值不進 App Log
      cookies.json 讀不了時照 E3 問要不要搬開
    test: [TestCookiesAreKept, TestReaderSignsInAndSearches]
  - id: 14
    spec: 3
    implementation: |
      [2] Space menu 最上面三列，沒有熱鍵：
      Source：tgo 的 Viewer，抓下來的原始內容，照內容類型上色；App Log「Read the source of …」
      Cookies：Viewer，這個網站（可註冊網域，IP 與 localhost 是自己）的 cookie；X 開 confirm「Clear N cookies?」再清（一次刪很多在 X，tdp K13；menu 那一列的說明寫「this site's; [X] in it clears them」）；App Log「Read the cookies of …」
      Requests：Viewer，載入這一頁發出的請求，curl -v 的寫法：每一次轉址、兩個方向的 header；App Log「Read the requests of …」
      三個 viewer 都有 lib 的 / 搜尋與 v 選取
    test: [TestReaderPageInfo, TestRequestsAndSource, TestSiteCookies]
  - id: 15
    spec: 3
    implementation: |
      連到檔案的連結：下載到 download_dir（預設 ~/.webu/datas/downloads），Downloads 多一列
      chip 列右端（statusbar）寫幾個下載中，分隔線從左邊填 Green 當進度條
      D Downloads 畫面（tgo List）：Enter 用桌面的 app 開檔（只有下載完成的）、o 開來源頁、x 移除（還在下載的停掉）、y 複製路徑、X 清掉已完成與已取消的（一次刪很多在 X，tdp K13）、/ 過濾
      404 等：toast 說沒有那一頁
    test: [TestReaderDownloadsAndMissingPages, TestTextBig5AndDownloads]
  - id: 16
    spec: 3
    implementation: |
      B Bookmarks 畫面（tgo List）：一次一層，像 filu 走目錄：先列這一層的目錄（目錄 icon 加名字），再列這一層的書籤
      位置列：目錄 icon，加這一層的路徑，最上層是 /（例 /dev/go）
      Enter：在目錄上是 Into，進去，cursor 在第一列，App Log 記「Went to the folder …」；在書籤上是 Open，在背後開新分頁
      Esc：有 filter 時 lib 先清 filter；在目錄裡 Panel.OnEsc 回上一層，cursor 停在剛剛出來的目錄，不記 App Log；最上層 OnEsc 是 nil，Esc 什麼都不做，? 也不列 Esc
      換層時清掉 filter：清單、filter 與 N of M 都只算這一層
      app 自己把 cursor 放到某一項的動作（a、A、r 改名、I 匯入，與 [2] 的 A 加書籤之後）都經過 bmGo：先清掉 filter，不管那一項有沒有被藏住，再換清單、移 cursor
      空的一層：最上層「No bookmarks yet」／「Press [a] to add one, or [Space] to see what you can do here」，目錄裡「Nothing in this folder」／「Press [a] to add a bookmark here, or [Esc] to go up」
      a 在這一層加書籤（form：URL 與標題，然後 Add，預填目前頁），cursor 在新的那一筆；[2] 的 A 也是，加在最上層，Bookmarks 畫面跟著回到最上層、cursor 在新的那一筆
      A 在這一層新增目錄（TextInput，a/b/c 每層都建，cursor 在這一層新的那一列）；m 搬移（開目錄的 select，每個目錄寫它的路徑，跟位置列一樣，最上層 / 在最前面，各列對齊），搬走的離開這一層，cursor 留在原位；r 改名（書籤改標題，目錄改那一層，下面的跟著）；空的或重複的名字留在框裡
      x 刪除：開 confirm「Delete …?」，目錄連整棵樹，每次都問
      y 複製網址；I 匯入：file-picker 選瀏覽器的書籤匯出檔（Netscape 格式），匯到自己的目錄，畫面到那個目錄所在的那一層、cursor 在它上面；/ 過濾
      存在資料目錄的 bookmarks.yaml
    test: [TestImportBookmarks, TestParseNetscape, TestDeleteFolderTree, TestDeleteAsksAboutTheRowUnderTheCursor, TestRenameBookmarks, TestScreensAndSession]
  - id: 17
    spec: 3
    implementation: |
      H History 畫面（tgo List）：看過的頁，新的在上
      Enter 在背後開新分頁、x 刪除這一筆、y 複製網址、X 清空（先問；沒有紀錄時停用；一次刪很多在 X，tdp K13）、/ 過濾
      存在資料目錄
    test: [TestHistoryIsNewestFirstAndDeletable]
  - id: 18
    spec: 1
    implementation: |
      S Settings 畫面是 tgo 的 Values，一列一個 config.yaml 的值，設好就存：
      search_engine、文字設定開 TextInput，目前生效的值當灰字提議，Backspace 再 Enter 是預設
      download_dir 開 file-picker 選目錄；restore_session 是原地翻的開關
      家族共用的 hide_secrets_in_preview（開關）與 input_tab_width（NumberInput，單位 spaces）
      config.yaml 裡 Settings 不認得的值，那一列的名字畫 Red
    test: [TestSettingsCoverConfig]
  - id: 19
    spec: 1
    implementation: |
      v（[2] 的 panel 動作）進 Visual mode（tgo 的 Mode，框 Yellow、右上角 Visual）；從畫面頂端開始的逐字 cursor
      h|j|k|l、w|b|e、0|$、u|d、gg|G 移動；v 開始選取，進 Visual>select 這一層（EnterLayer），選取中 v 不作用
      y Cop[y]：選的字複製到系統剪貼簿，Success toast
      / 開 TextInput「Find」：找到的加底線，n|N 走；找不到 Info toast「Not on the page: …」；有命中時 Panel.SearchStatus 在下框寫狀態；從 mode 的 Space menu 跑時 Done 呼叫 App.CloseAll
      Enter 按下 cursor 所在的東西
      Esc：選取中先放掉選取回到 Visual，沒有選取時離開
      mode 的 Space menu：Select、Copy、Press 在最前面；只有選的範圍是 Yellow
    test: [TestSelectMotionsAndYank, TestSelectSearchSmartCaseAndClick, TestSelectRowsDrawTheCursor, TestVisualModeGoesBackALayer, TestReaderSearchesAsTdp120Says]
  - id: 20
    spec: 1
    implementation: |
      [2] 的 panel 動作 Y：這一頁的網址複製到剪貼簿；Yank markdown（Space menu，沒有熱鍵）：這一頁的內容轉成 markdown 複製；做完 Success toast
      剪貼簿用系統的指令（macOS pbcopy；Linux wl-copy、xclip 或 xsel）；成功 Success toast「Copied N lines」，失敗 Error toast「Copy failed: …」（缺工具時寫要裝什麼）
    test: [commit: bf34a3d]
  - id: 21
    spec: 3
    implementation: |
      設定 ~/.config/webu（$XDG_CONFIG_HOME/webu，或 $WEBU__CONFIG）：config.yaml
      狀態跟設定放一起（或 $WEBU__STATE）：session.yaml、cookies.json
      資料 ~/.webu/datas（$WEBU__DATA）：bookmarks.yaml、歷史、下載；快取 $WEBU__CACHE
      環境變數一律 WEBU__ 開頭，舊名字不讀
      第一次啟動把在舊位置、新位置還沒有的檔搬過去（bookmarks.yaml 到資料、session.yaml 到狀態），Info toast 說從哪裡搬到哪裡，搬空的舊目錄拿掉；搬不動的照舊用原位置，error popup 寫兩個位置；新位置已經有的不搬，舊的照樣留著、用新位置的，error popup 寫兩個位置、請使用者自己合併
      自己的檔讀不了：啟動時開 tgo 的 MoveAside，說是哪個檔、為什麼，問要不要搬到 .bak（.bak.1 起，不蓋過別的）、像第一次一樣開始；回答之前什麼都不開；Esc 離開，原因印在終端機
      讀得到、但有 webu 用不了的值或對不上的一筆（tdp E3 a value that does not fit）不算讀不了：config.yaml 一個 key 一個 key 讀，型別不對的、search_engine 不是網址（沒有 ://，跟 Settings 一樣）、input_tab_width 不在 0–16 的用預設值；bookmarks.yaml 沒有網址的書籤拿掉，目錄寫成一層一層（去掉空白與空的層：「 dev / /go 」是 dev/go），整理完是空的或重複的目錄拿掉，書籤的目錄整理完是空的（「/」）就是最上層、不算；history.yaml 沒有網址的一筆拿掉；session.yaml 沒有網址的分頁拿掉、shown 不在範圍裡用 0。YAML 壞了、或整個檔不是 key 與值的，才是讀不了
      這樣的檔在啟動時（main，開畫面之前）用 tgo 的 KeepAside 複製到 .bak（.bak.1 起，不蓋過別的），再不帶那些值寫回去；第一個畫面用 tgo 的 App.Notify 與 MisfitNotice 說：Warning toast 寫檔名與副本（「1 value in config.yaml did not fit: defaults used, yours kept in config.yaml.bak」），App Log 每一個值或一筆一條 WARN（「config.yaml: restore_session "maybe" did not fit; using "true"」、「bookmarks.yaml: bookmark 2 (url "") did not fit; taken out」）；搬了位置的 Info 在它前面，照發生的順序，每一件是自己的 toast、疊起來（tgo 的 Notify，tdp toast.2）
      副本做不了時檔案照舊不動，這一次用預設值：Error 寫 KeepAside 的原因（「bookmarks.yaml.bak could not be made: …; bookmarks.yaml left as it was」），每一個照樣一條 WARN，下次啟動再找到；副本做好了、寫回去失敗時也是 Error，說副本在哪
