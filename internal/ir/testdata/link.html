<!doctype html><html><head><title>link</title></head><body>
<p><a href="https://example.com/page?x=1#f">Absolute link</a></p>
<p><a href="/relative/path">Relative link</a></p>
<p><a href="mailto:a@b.c">Mail link</a></p>
<p><a href="/img"><img src="/pic.png" alt="Picture link"></a></p>
<p><a href="/noalt"><img src="/pic.png"></a></p>
<p><a>Anchor without href</a></p>
<p><a href="/rich"><strong>Rich</strong> <em>content</em> link</a></p>
<p><a href="/new" target="_blank">Opens new tab</a></p>
</body></html>
