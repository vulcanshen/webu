<!doctype html><html><head><title>textbox</title></head><body>
<label>Empty <input type="text" name="e"></label>
<label>Filled <input type="text" name="f" value="some text"></label>
<label>Search <input type="search" name="s" value="query"></label>
<label>Password <input type="password" name="p" value="secret"></label>
<label>Email <input type="email" name="m" value="a@b.c"></label>
<label>Number <input type="number" name="n" value="42"></label>
<label>Read only <input type="text" value="fixed" readonly></label>
<label>Required <input type="text" required></label>
<label>Disabled <input type="text" value="nope" disabled></label>
<input type="text" placeholder="Placeholder only">
<input type="text" aria-label="Labelled by aria">
<label>Area <textarea name="t">line one
line two</textarea></label>
<label>Empty area <textarea name="u"></textarea></label>
<div contenteditable="true" aria-label="Editable div">typed here</div>
</body></html>
