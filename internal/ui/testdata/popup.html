<!doctype html><html><head><title>Popups</title><style>
  body { margin: 0; font: 16px/1.4 sans-serif; }
  header { height: 60px; }
  main { min-height: 1400px; padding: 20px; }
  footer { height: 80px; }
  .sheet { position: fixed; top: 120px; left: 200px; width: 600px; padding: 24px; background: #eee; border: 1px solid #999; }
  .toast { position: fixed; top: 10px; right: 10px; padding: 8px 12px; background: #ffd; border: 1px solid #cc9; }
</style></head><body>
<header><a href="#">Top link</a></header>
<main>
<h1>Popups</h1>
<p>Some body text with <a href="#body">a link</a> in it.</p>
<p><button type="button" onclick="document.getElementById('dlg').showModal()">Open dialog</button>
<button type="button" onclick="var s=document.getElementById('sheet'); s.hidden=false; s.querySelector('button').focus()">Open sheet</button>
<button type="button" onclick="var t=document.createElement('div'); t.className='toast'; t.textContent='Saved.'; document.body.appendChild(t)">Notify</button>
<button type="button" disabled>Nope</button></p>
<p id="out">nothing yet</p>
</main>
<footer><a href="#">Bottom link</a></footer>
<dialog id="dlg"><p>We use cookies on this site.</p>
<button type="button" onclick="document.getElementById('out').textContent='accepted'; document.getElementById('dlg').close()">Accept</button>
<button type="button" onclick="document.getElementById('out').textContent='later'; document.getElementById('dlg').close()">Later</button></dialog>
<div id="sheet" class="sheet" hidden><p>Your session is about to expire.</p>
<button type="button" onclick="document.getElementById('out').textContent='extended'; document.getElementById('sheet').hidden=true">Stay signed in</button></div>
</body></html>
