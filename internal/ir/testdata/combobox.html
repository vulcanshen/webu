<!doctype html><html><head><title>combobox</title></head><body>
<label>Pick one <select name="s"><option>Alpha</option><option selected>Beta</option><option>Gamma</option></select></label>
<label>Grouped <select name="g"><optgroup label="G1"><option>a</option></optgroup><optgroup label="G2"><option selected>b</option></optgroup></select></label>
<label>Disabled <select disabled><option>x</option></select></label>
<label>Multi <select multiple><option selected>m1</option><option>m2</option></select></label>
<label>Datalist <input list="dl" name="d"><datalist id="dl"><option value="d1"><option value="d2"></datalist></label>
</body></html>
