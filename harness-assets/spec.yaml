id: 1
from: 0
to: v1.2.1
tasks:
  - id: 1
    spec: 1
    request: 五個畫面用大寫字母切換：Web、Bookmarks、History、Downloads、Settings；Web 畫面是分頁清單與頁面並排，頁面顯示分頁清單游標所在的那一頁
    tdp: [tdp screen.1, tdp screen.3, tdp screen.5, tdp screen.6, tdp panel.1, tdp panel.4, tdp terms.2, tdp P5]
    remark:
      - |
        Web 畫面的版面（窄寬也是兩個 panel 並排；`Z` 讓 [2] 佔滿寬度）：
         [W]EB  [B]OOKMARKS  [H]ISTORY  [D]OWNLOADS  [S]ETTINGS
        ┌[1] TABS──────┐┏[2] PAGE━━━━━━━━━━━━━━━━━━━━━━━━━━┓
        │ TITLE        │┃ 󰖟 https://…                      ┃
        │  site title  │┃ 頁面內容                          ┃
        └──────────────┘┗━ H:back L:forward ━━━ 1-24 of 310 ━┛
      - 畫面鍵 W、B、H、D、S 是領域熱鍵（tdp P5）
  - id: 2
    spec: 1
    request: 命令列：`webu` 開回上次的分頁、給網址就一個網址一個分頁、不是網址的字拿去搜尋、`webu help` 印完整的命令列說明
    tdp: [tdp E1, tdp E3, tdp P5]
    remark:
      - 上次的分頁存在狀態檔 session.yaml；設定 restore_session 決定要不要開回來
  - id: 3
    spec: 1
    request: 分頁清單：每個分頁前面是網站的記號（網站自己的 icon，沒有就是地球，顏色取自 favicon），可以到頁面、關閉、在新分頁再開、重新載入、複製網址、新分頁、關閉其他、重開剛關的
    tdp: [tdp panel.5, tdp K3, tdp M5, tdp K12, tdp P5]
    remark:
      - 網站記號的 icon 與顏色是領域的符號與顏色（tdp P5）
  - id: 4
    spec: 1
    request: 讀網頁：照原樣抓下來、不跑 JavaScript，顯示這一頁直接給的內容，網站外殼不顯示；`w` 切到整頁、再按回到正文
    tdp: [tdp P5, tdp M5]
    remark:
      - 怎麼挑正文是功能邏輯（tdp P5）
  - id: 5
    spec: 1
    request: 頁面畫成適合終端機的樣子：標題的字放在它那一層的顏色上，清單是短橫線或編號，程式碼依語言上色、寫出語言名，引用前面有直槓，表格畫成格子，連結與圖片前面有 icon；網頁裡的控制字元不直接送到終端機
    tdp: [tdp P4, tdp P5, tdp color.1, tdp color.2, tdp components.5, tdp file-picker.3]
    remark:
      - 照 catu 畫 markdown 的方式（user 2026-11-09）：沒有行號，字左右各留一格；引用的直槓依深度用標題的層色
      - 程式碼用家族共用的語法色（tdp file-picker.3）
  - id: 6
    spec: 1
    request: 像 `less` 一樣捲動：`j|k|u|d|gg|G`；下框顯示讀到哪
    tdp: [tdp K12, tdp panel.1]
  - id: 7
    spec: 1
    request: 頁面最上面是網址；頁面還在來、或抓不到時，頁面中間說明，網址照樣在
    tdp: [tdp panel.10, tdp panel.15, tdp T2]
    remark:
      - 網址前面放 nf-md-web（tdp panel.10 讓 app 決定位置列的 glyph）
  - id: 8
    spec: 1
    request: 頁面上 `/` 找字、找到的都加底線，`n|N` 在找到的之間跳，`Esc` 收起來
    tdp: [tdp note.3, tdp panel.14, tdp note.7, tdp T1, tdp K4]
  - id: 9
    spec: 1
    request: Focus mode（`f`）：`j|k` 在連結、圖片、欄位、按鈕之間走，停在連結上時寫出它會去的網址，`Enter` 按下去；`o` 開在新分頁、`y` 複製網址
    tdp: [tdp K11, tdp K12, tdp toast.4, tdp menu.4, tdp P6]
  - id: 10
    spec: 1
    request: '`H|L` 沿著這個分頁自己的歷史上一頁、下一頁；`b` 是麵包屑：這個分頁走過的每一頁，選一頁就跳過去'
    tdp: [tdp P5, tdp M5, tdp menu.1]
    remark:
      - 麵包屑照 kbu 的做法（user 2026-10-29）
  - id: 11
    spec: 1
    request: '`o` 開網址框，用灰字提議目前的網址；不是網址的字拿去搜尋'
    tdp: [tdp input.2, tdp input.5, tdp P5]
    remark:
      - 預設搜尋 DuckDuckGo 的 HTML 版（Google 會對程式送來的搜尋跳 CAPTCHA）
  - id: 12
    spec: 1
    request: 表單做到搜尋框與簡單的帳密登入：填欄位、勾選、選選項、按按鈕送出；只有一個可以打字的欄位時，填完問要不要送出
    tdp: [tdp input.10, tdp password, tdp select, tdp checkbox, tdp confirm, tdp P5]
  - id: 13
